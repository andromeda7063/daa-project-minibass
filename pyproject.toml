[project]
name = "minibass"
version = "0.2.0"
description = "MiniBass: Low-frequency sound field optimization, modal Green's functions, and discrete active multi-subwoofer synthesis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
